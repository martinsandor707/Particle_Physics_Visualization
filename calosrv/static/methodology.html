<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/js/theme_boot.js"></script>
<title>Calorimeter Shower Reconstruction — Methodology</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/controls.css">
<link rel="stylesheet" href="/static/css/methodology.css">
</head>
<body>

<!-- The Methodology page: one journal-style article on how every panel of
     the other two pages is computed and drawn - the frames, the
     discretisation, the attribution channels, the statistics and the
     perceptual rules - with numbered equations in native MathML, tables, three
     figures computed from the dashboard's own palettes, and badges that open
     the live panel the prose describes.

     The shell is the other pages': header, page tabs, a collapsible sidebar
     (here the article's outline), so js/shell.js serves it; there is no
     Details drawer and no chart. js/methodology_main.js builds the article
     from js/methodology/content/ through js/methodology/render.js, as DOM
     nodes, never as markup parsed from a string; it needs no network, so the
     article reads the same when the service does not answer.

     The page never writes a view key into the hash. It carries the reader's
     view to the badges and the tabs (the chip in the header says which view),
     and keeps its own place in one key of its own, at=, written only when the
     reader clicks a TOC entry, a heading's anchor or an equation's number.
     Print (@media print in css/methodology.css) drops the shell and sets the
     article in black ink on white. -->
<div class="app methodology-app">

  <!-- ============================================================= header -->
  <header class="header">
    <button class="icon-button" id="sidebar-toggle" type="button"
            aria-controls="sidebar" aria-expanded="true"
            aria-label="Collapse the article outline" title="Collapse the outline">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <div>
      <p class="app-name">Calorimeter Shower Reconstruction</p>
      <div class="subtitle">Methodology &mdash; how every panel is computed and drawn</div>
    </div>

    <nav class="page-tabs" id="page-tabs" aria-label="Dashboard pages">
      <a class="page-tab" data-page="physics" data-page-tab href="/" title="The 2 × 2 spatial diagnostic and the physics cards">Physics</a>
      <a class="page-tab" data-page="models" data-page-tab href="/models" title="Model performance, the feature explorer and the 3-D views">Models</a>
      <a class="page-tab is-current" data-page="methodology" data-page-tab href="/methodology" aria-current="page" title="How every panel is computed and drawn, as one article">Methodology</a>
    </nav>

    <span class="spacer"></span>

    <div class="badge" id="view-chip" title="The view the article's links open on the other pages">
      <span>Links open:</span> <b id="view-chip-text">&mdash;</b>
    </div>

    <div class="badge" id="compute-badge" title="DuckDB memory ceiling and worker threads allocated at boot">
      <span class="dot"></span>
      <span>DuckDB <b id="badge-memory">—</b> · <b id="badge-threads">—</b> threads</span>
    </div>

    <button class="icon-button theme-toggle" id="theme-toggle" type="button"
            aria-label="Switch to the light theme" title="Switch to the light theme">
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 1.5v1.75M8 12.75v1.75M1.5 8h1.75M12.75 8h1.75M3.4 3.4l1.24 1.24M11.36 11.36l1.24 1.24M3.4 12.6l1.24-1.24M11.36 4.64l1.24-1.24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M13.5 9.6A5.75 5.75 0 0 1 6.4 2.5a5.75 5.75 0 1 0 7.1 7.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- The article as one zip, built in the browser (js/methodology/export.js):
         LaTeX, BibTeX and every figure as SVG and PNG, drawn for paper. -->
    <button class="action" id="export-article" type="button"
            title="Download the article as LaTeX, its references as BibTeX and its figures as SVG and PNG, in one zip file">Export</button>
  </header>

  <!-- ============================================================ sidebar -->
  <aside class="sidebar" id="sidebar">
    <h2 id="toc-heading">Contents</h2>
    <nav class="toc" id="toc" aria-labelledby="toc-heading"></nav>
  </aside>

  <!-- =============================================================== main -->
  <main class="main" id="main">
    <div class="banner" id="banner" hidden>
      <span class="banner-text" id="banner-text"></span>
      <button class="banner-close" id="banner-close" type="button" aria-label="Dismiss">&times;</button>
    </div>
    <article class="paper" id="paper"></article>
  </main>
</div>

<script type="module" src="/static/js/methodology_main.js"></script>
</body>
</html>
