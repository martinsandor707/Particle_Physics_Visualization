services:
  calorimeter-dashboard:
    build: .
    container_name: calorimeter-dashboard
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Read-only mount of the repository so the offline ingest CLI can reach
      # multi-gigabyte CSVs on the host without them traversing HTTP:
      #   docker compose exec calorimeter-dashboard \
      #     python -m calosrv.ingest --input /app/host/hits_all_models.csv --table all_models
      - .:/app/host:ro
    environment:
      # DuckDB's memory ceiling in GB. 16 by default; `--env-file laptop.env`
      # lowers it for a computer that can give Docker 8 GB (README, Quick
      # start), and the production server sets 100.
      - DUCKDB_MEMORY_GB=${DUCKDB_MEMORY_GB:-16}
      - PORT=8000
      # Uploads are spooled by Starlette before the route stages them; keep
      # that on the data volume, never in a tmpfs /tmp (which is RAM).
      - TMPDIR=/app/data/staging
      # Drop folder: every new CSV or Parquet file in ./ingest on the host
      # becomes an experiment at the next start, or on Scan now in the Admin
      # Settings panel. Read-only in here, through the /app/host mount above;
      # an experiment that already exists is never replaced.
      - CALOSRV_AUTO_INGEST_DIR=/app/host/ingest
      # The default experiment a new session opens on, as a fallback beneath
      # whatever the Admin Settings panel saves: the production dataset the
      # drop folder ingests from ingest/hits_all_models.parquet.
      - CALOSRV_DEFAULT_DATASET=hits_all_models
    # DuckDB's memory_limit accounts for its buffer manager only - not the Python
    # heap, NumPy result conversion or the bundle caches. Give the container
    # DUCKDB_MEMORY_GB + 4 GB of headroom or ingest will be OOM-killed;
    # laptop.env sets both together.
    mem_limit: ${CONTAINER_MEMORY_LIMIT:-20g}
    # Without this the container may use as much swap again, and on a host
    # whose swap is zram that swap is compressed RAM.
    memswap_limit: ${CONTAINER_MEMORY_LIMIT:-20g}
    restart: unless-stopped
