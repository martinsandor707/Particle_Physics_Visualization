services:
  # Fetches the datasets and the XGBoost models from the project's Hugging
  # Face dataset into ./ingest and ./xgboost_models, then exits. The dashboard
  # waits for it to finish, so `docker compose up --build` is the whole
  # download-and-start command. HF_SYNC=0 skips the fetch (offline, or files
  # copied by hand); an offline start succeeds when the last sync's files
  # are complete. It is the only service with write access to those folders.
  hf-sync:
    build:
      context: .
      target: hf-sync
    volumes:
      - ./ingest:/sync/ingest
      - ./xgboost_models:/sync/xgboost_models
    environment:
      # 1 fetches, 0 skips the sync altogether.
      - HF_SYNC=${HF_SYNC:-1}
      - HF_SYNC_REPO=${HF_SYNC_REPO:-martinsandor707/particles_combined_all_models}
      - HF_SYNC_REVISION=${HF_SYNC_REVISION:-main}
      # Comma-separated globs, matched against the dataset's paths with `*`
      # crossing `/`: the same patterns as the README's `hf download`.
      - HF_SYNC_INCLUDE=${HF_SYNC_INCLUDE:-ingest/*.parquet,xgboost_models/*.json}
      # A file the last sync wrote is always brought up to date. One changed on
      # this computer since then (or, at a first sync, one of another size) is
      # kept and named in the log; 1 replaces it with the dataset's version.
      - HF_SYNC_OVERWRITE=${HF_SYNC_OVERWRITE:-0}
      # Only for a private copy of the dataset; the public one needs no token,
      # and an empty value is read as none.
      - HF_TOKEN=${HF_TOKEN:-}
    # A small init process as PID 1, so Ctrl-C or `docker compose stop` reaches
    # the download (a Python PID 1 would ignore SIGTERM) and a half-finished
    # file is left in the staging folder, never in place of a dataset.
    init: true
    restart: "no"

  calorimeter-dashboard:
    build:
      context: .
      target: app
    container_name: calorimeter-dashboard
    depends_on:
      hf-sync:
        condition: service_completed_successfully
    ports:
      # The host side is HOST_PORT (8000 by default), for a computer where
      # 8000 is taken; the container always listens on 8000.
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      # Read-only mounts of the two folders the service reads; nothing else of
      # the repository is mounted. A multi-gigabyte file in ./ingest reaches
      # the ingest CLI in place, without traversing HTTP:
      #   docker compose exec calorimeter-dashboard \
      #     python -m calosrv.ingest --input /app/ingest/hits_all_models.parquet --table all_models
      - ./ingest:/app/ingest:ro
      - ./xgboost_models:/app/xgboost_models:ro
    environment:
      # DuckDB's memory ceiling in GB. 16 by default; `--env-file laptop.env`
      # lowers it for a computer that can give Docker 8 GB (README, Quick
      # start), and the production server sets 100.
      - DUCKDB_MEMORY_GB=${DUCKDB_MEMORY_GB:-16}
      - PORT=8000
      # Uploads are spooled by Starlette before the route stages them; keep
      # that on the data volume, never in a tmpfs /tmp (which is RAM).
      - TMPDIR=/app/data/staging
      # Drop folder: every new CSV or Parquet file in ./ingest on the host
      # becomes an experiment at the next start, or on Scan now in the Admin
      # Settings panel. Read-only in here, through the /app/ingest mount above.
      - CALOSRV_AUTO_INGEST_DIR=/app/ingest
      # The one folder server-side ingest may read (Upload dataset → Already
      # on the server, and the ingest CLI above): the drop folder's mount,
      # since nothing else of the repository is mounted.
      - CALOSRV_LOCAL_INGEST_DIR=/app/ingest
      # The notebooks' XGBoost regressors: one folder scan finds them all.
      - CALOSRV_MODEL_DIR=/app/xgboost_models
      # The default experiment a new session opens on, as a fallback beneath
      # whatever the Admin Settings panel saves: the production dataset the
      # drop folder ingests from ingest/hits_all_models.parquet.
      - CALOSRV_DEFAULT_DATASET=hits_all_models
    # DuckDB's memory_limit accounts for its buffer manager only - not the Python
    # heap, NumPy result conversion or the bundle caches. Give the container
    # DUCKDB_MEMORY_GB + 4 GB of headroom or ingest will be OOM-killed;
    # laptop.env sets both together.
    mem_limit: ${CONTAINER_MEMORY_LIMIT:-20g}
    # Without this the container may use as much swap again, and on a host
    # whose swap is zram that swap is compressed RAM.
    memswap_limit: ${CONTAINER_MEMORY_LIMIT:-20g}
    restart: unless-stopped
